name: Publish Release to R2

on:
  release:
    types: [published]

jobs:
  upload-r2:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Get Channels
        id: channel
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "prefixes=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prefixes=beta latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Release Assets
        run: |
          mkdir -p release-assets
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --skip-existing

      - name: Write Changelog
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > release-assets/CHANGELOG.md

      - name: List Release Assets
        run: ls -lh release-assets

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set default.region auto

      - name: Sync Release Assets to R2
        run: |
          for prefix in ${{ steps.channel.outputs.prefixes }}; do
            echo "Syncing to $prefix bucket..."
            aws s3 sync release-assets/ "s3://${{ secrets.R2_BUCKET }}/$prefix/" \
              --delete \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          done

      - name: Verify Upload
        run: |
          for prefix in ${{ steps.channel.outputs.prefixes }}; do
            curl -fsSI "https://${{ secrets.R2_DOMAIN }}/$prefix/latest.yml" \
              || (echo "::error::latest.yml not reachable at ${{ secrets.R2_DOMAIN }}/$prefix after upload" && exit 1)
          done

  publish-gitlab:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push Tag
        run: |
          git remote add gitlab https://${{ secrets.GITLAB_USER }}:${{ secrets.GITLAB_TOKEN }}@gitlab.com/${{ secrets.GITLAB_USER }}/${{ secrets.GITLAB_REPO }}.git
          git push gitlab "${{ github.event.release.tag_name }}"

      - name: Download Release Assets
        run: |
          mkdir -p release-assets
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --skip-existing

      - name: Write Changelog
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > CHANGELOG.md

      - name: Create Release
        env:
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          GITLAB_USER: ${{ secrets.GITLAB_USER }}
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          project=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['GITLAB_USER']+'/'+os.environ['GITLAB_REPO'], safe=''))")
          body=$(jq -Rs . < CHANGELOG.md)

          links="[]"
          for f in release-assets/*; do
            filename=$(basename "$f")
            url="https://gitlab.com/api/v4/projects/$project/packages/generic/release-assets/$TAG/$filename"
            http_code=$(curl -s -o /dev/null -w '%{http_code}' --request PUT \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --upload-file "$f" \
              "$url")
            if [ "$http_code" -ge 400 ]; then
              echo "::error::Failed to upload $filename to GitLab package registry (HTTP $http_code)"
              exit 1
            fi
            links=$(echo "$links" | jq --arg name "$filename" --arg url "$url" '. + [{"name":$name,"url":$url}]')
          done

          http_code=$(curl -s -o response.json -w '%{http_code}' --request POST \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --header "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$NAME\",\"description\":$body,\"assets\":{\"links\":$links}}" \
            "https://gitlab.com/api/v4/projects/$project/releases")

          if [ "$http_code" -ge 400 ]; then
            echo "::error::GitLab release creation failed (HTTP $http_code)"
            cat response.json
            exit 1
          fi

  publish-codeberg:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push Tag
        run: |
          git remote add codeberg https://${{ secrets.CODEBERG_USER }}:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/${{ secrets.CODEBERG_USER }}/${{ secrets.CODEBERG_REPO }}.git
          git push codeberg "${{ github.event.release.tag_name }}"

      - name: Download Release Assets
        run: |
          mkdir -p release-assets
          gh release download "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --skip-existing

      - name: Write Changelog
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          printf '%s\n' "$RELEASE_BODY" > CHANGELOG.md

      - name: Create Release
        id: codeberg
        env:
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          owner="$CODEBERG_USER"
          repo="$CODEBERG_REPO"
          body=$(jq -Rs . < CHANGELOG.md)
          http_code=$(curl -s -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: token $CODEBERG_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$NAME\",\"body\":$body,\"draft\":false,\"prerelease\":false}" \
            "https://codeberg.org/api/v1/repos/$owner/$repo/releases")

          if [ "$http_code" -ge 400 ]; then
            echo "::error::Codeberg release creation failed (HTTP $http_code)"
            cat response.json
            exit 1
          fi

          echo "release_id=$(jq -r '.id' response.json)" >> "$GITHUB_OUTPUT"

      - name: Upload Assets
        env:
          CODEBERG_USER: ${{ secrets.CODEBERG_USER }}
          CODEBERG_REPO: ${{ secrets.CODEBERG_REPO }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          owner="$CODEBERG_USER"
          repo="$CODEBERG_REPO"
          for f in release-assets/*; do
            curl -sf -X POST \
              -H "Authorization: token $CODEBERG_TOKEN" \
              -F "attachment=@$f" \
              "https://codeberg.org/api/v1/repos/$owner/$repo/releases/${{ steps.codeberg.outputs.release_id }}/assets"
          done